name: Keep Supabase project awake

# Supabase's free tier pauses a project after ~1 week with no activity.
# This pings a lightweight table read once every 4 days so the free
# database never pauses, without needing any paid "always-on" add-on.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: "0 6 */4 * *" # every 4 days at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
